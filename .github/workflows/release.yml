name: Build and Release

# Releasing is dispatch-driven so Cargo.toml can never drift from the tag: the
# version you type here is written into Cargo.toml, and that bump commit is
# what gets tagged. There is deliberately no `push: tags` trigger — a
# hand-pushed tag would bypass the bump and reintroduce the drift this
# workflow exists to prevent.
#
# Transactional: CI and every platform build run on the pinned source with the
# bumped manifest first. Only the final `publish` job writes to the repo, and
# it moves main and the tag in one atomic push. A failure before that leaves
# main, tags and releases untouched; a failure after it is finished by
# "Re-run failed jobs" (see release.sh publish-commit).
#
# Every release ships SHA256SUMS, a CycloneDX SBOM per platform and a build
# provenance attestation. `publish` never runs in a dry run, so its attestation
# steps are first exercised by a real release; they sit before the push, where
# a failure still leaves the repository untouched and a fixed workflow can
# simply be dispatched again.
#
# The version input only ever reaches shell code through an environment
# variable — never `${{ inputs.* }}` inside `run:` — and is validated by
# .github/scripts/release.sh before any other use.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.3.3)'
        required: true
        type: string
      dry_run:
        description: 'Run every check and build, but publish nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Two releases racing would both pass the "main has not moved" check.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and bump
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
      commit_epoch: ${{ steps.pin.outputs.commit_epoch }}
    steps:
      # github.sha is main's tip at dispatch time. Every later job builds and
      # tags exactly this commit, even if main moves on meanwhile.
      - name: Pin the source revision
        id: pin
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::releases must be dispatched from main (got $GITHUB_REF); use dry_run to test another branch"
            exit 1
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          # Fixed once here so a rerun of `publish` rebuilds the identical commit.
          echo "commit_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash .github/scripts/release.sh validate "$VERSION"
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

      - name: Set the crate version
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash .github/scripts/release.sh bump "$VERSION"
          grep -n '^version' Cargo.toml

          # Syncs Cargo.lock's poopman entry without compiling and without
          # touching dependency versions. `cargo metadata` does NOT rewrite the
          # lock here, and `cargo generate-lockfile` would re-resolve everything.
          cargo update --workspace

          if git diff --quiet; then
            echo "::error::Cargo.toml is already at $VERSION — nothing to release"
            exit 1
          fi
          git diff --stat

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload bumped manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            Cargo.toml
            Cargo.lock

  # The same gates a pull request must pass, on the pinned revision. Waits for
  # prepare so a rejected version doesn't spend a full CI run first.
  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64. Build on Ubuntu 22.04 so the dynamically linked
          # binary has a glibc baseline that works on broadly current distros.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_name: Poopman-linux-x86_64

          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: Poopman-macos-x86_64

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: Poopman-macos-aarch64

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: Poopman-windows-x86_64

    steps:
      # The pinned revision plus the bumped manifest is exactly the tree the
      # release commit will have, so the binaries carry the new version.
      - name: Checkout the pinned revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download bumped manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-manifest

      - name: Apply bumped manifest
        shell: bash
        run: cp release-manifest/Cargo.toml release-manifest/Cargo.lock .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Keep in sync with the list in ci.yml and README "Linux".
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libexpat1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          # Ensure Xcode command line tools are available
          xcode-select --print-path
          # GPUI requires Metal framework which is included in macOS SDK

      # Pinned: cargo-bundle 0.12.0 rejects the [package.metadata.bundle.windows]
      # table in Cargo.toml. Bump deliberately, with a dry run.
      - name: Install cargo-bundle (macOS)
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle --version 0.11.0 --locked

      # Pinned like cargo-bundle. Bump deliberately, with a dry run.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Resolved from the Cargo.lock the binary was just built from, limited
      # to the dependencies this target actually pulls in. Written next to
      # Cargo.toml as <asset_name>.cdx.json.
      - name: Generate SBOM
        run: >-
          cargo cyclonedx --format json --spec-version 1.5
          --target ${{ matrix.target }}
          --override-filename ${{ matrix.asset_name }}.cdx

      - name: Create app bundle (macOS)
        if: runner.os == 'macOS'
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_PATH="target/${{ matrix.target }}/release/bundle/osx/Poopman.app"
          DMG_NAME="${{ matrix.asset_name }}.dmg"

          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -r "$APP_PATH" dmg_contents/

          # Create a symbolic link to /Applications
          ln -s /Applications dmg_contents/Applications

          # Create the DMG
          hdiutil create -volname "Poopman" -srcfolder dmg_contents -ov -format UDZO "$DMG_NAME"

          # Cleanup
          rm -rf dmg_contents

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C target/${{ matrix.target }}/release \
            -czf ${{ matrix.asset_name }}.tar.gz poopman

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path poopman.exe -DestinationPath ../../../${{ matrix.asset_name }}.zip

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.dmg
            ${{ matrix.asset_name }}.cdx.json

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.cdx.json

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.cdx.json

  # Read-only, and part of a dry run: gathers every platform's package and
  # SBOM, insists the set is complete, and writes SHA256SUMS over it. `publish`
  # releases exactly this directory.
  assets:
    name: Collect release assets
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pinned revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download packages and SBOMs
        uses: actions/download-artifact@v4
        with:
          pattern: Poopman-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          bash .github/scripts/release.sh checksums dist \
            Poopman-linux-x86_64.tar.gz Poopman-linux-x86_64.cdx.json \
            Poopman-macos-x86_64.dmg Poopman-macos-x86_64.cdx.json \
            Poopman-macos-aarch64.dmg Poopman-macos-aarch64.cdx.json \
            Poopman-windows-x86_64.zip Poopman-windows-x86_64.cdx.json
          cat dist/SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, assets]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # The only job allowed to write to the repository. id-token and
    # attestations are for the provenance attestation: an OIDC token to obtain
    # the short-lived Sigstore signing certificate, and the right to store the
    # result.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      BASE_SHA: ${{ needs.prepare.outputs.sha }}
      COMMIT_EPOCH: ${{ needs.prepare.outputs.commit_epoch }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout the pinned revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download bumped manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-manifest

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Verify checksums
        run: |
          ls -l dist
          cd dist && sha256sum --strict -c SHA256SUMS

      # Attested and verified before anything is pushed: see the note at the
      # top of this file. Covers every asset, SHA256SUMS and the SBOMs included.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      # The command README gives users, tightened to this workflow and this
      # source revision, so a release whose provenance does not verify is
      # never published.
      - name: Verify the attestations
        run: |
          for asset in dist/*; do
            gh attestation verify "$asset" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-digest "$BASE_SHA"
          done

      # main and the tag move together in one atomic push, only if main is
      # still at the pinned revision. On a rerun after this succeeded, the
      # identical commit is rebuilt and recognized, and nothing is pushed.
      - name: Push the release commit and tag
        run: |
          cp release-manifest/Cargo.toml release-manifest/Cargo.lock .
          bash .github/scripts/release.sh publish-commit "$VERSION" "$BASE_SHA" "$COMMIT_EPOCH"

      # Built as a draft and published last, so nobody sees a release with
      # missing assets. A rerun finds the draft and re-uploads over it.
      - name: Create the GitHub release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            prerelease_flag=()
            if [ "$PRERELEASE" = true ]; then prerelease_flag=(--prerelease); fi
            gh release create "$tag" dist/* \
              --verify-tag --draft --generate-notes --title "$tag" "${prerelease_flag[@]}"
          fi
          gh release edit "$tag" --draft=false
