name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch makes the older run moot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, check, clippy, test
    # Same image as the Linux release build, so a green PR means the release
    # build's native dependencies resolve too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # Keep in sync with the Linux list in release.yml and README "Linux".
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libexpat1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --locked --all-targets --all-features

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The proxy variables point at a closed port on purpose: loopback wire
      # tests must reach their local listener directly, so any test that
      # starts honoring ambient proxy settings fails here instead of only on
      # machines that happen to have a proxy configured.
      - name: cargo test
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          all_proxy: http://127.0.0.1:9
        run: cargo test --locked --all-targets
